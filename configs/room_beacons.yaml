# Маяки комнаты: распечатанные метки ArUco DICT_4X4_50 на стенах (id 1–9; id 0 — цель подъезда).
# Файлы для печати (A4, 100 %): ~/.local/share/explorer3/world/beacons/beacon_1_A4.png … beacon_4_A4.png
# Начало координат — любой угол комнаты, ось x вдоль одной стены, y — вдоль соседней, метры.
# facing_deg — куда смотрит лицевая сторона метки (0 = вдоль +x, 90 = вдоль +y).
# z — высота центра метки от пола; side — сторона чёрного квадрата (лучше 0.20: точнее курс робота).
# Пока список пуст, роботы делятся памятью «что и кто видел», но без точного места в комнате.
beacons: []
# Пример:
# beacons:
#   - {id: 1, x: 0.0, y: 1.2, z: 0.30, facing_deg: 0,   side: 0.20}   # левая стена
#   - {id: 2, x: 2.0, y: 0.0, z: 0.30, facing_deg: 90,  side: 0.20}   # нижняя стена
#   - {id: 3, x: 4.0, y: 1.5, z: 0.30, facing_deg: 180, side: 0.20}   # правая стена
